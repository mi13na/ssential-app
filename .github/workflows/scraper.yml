
name: SSENSE Product URL Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  discover-products:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Discover product URLs
        run: python scraper/scrape.py

      - name: Upload products to Firestore
        working-directory: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python upload_to_firestore.py


      - name: Save discovered URLs as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: discovered-product-urls
          path: scraper/product_urls.json
          if-no-files-found: error
